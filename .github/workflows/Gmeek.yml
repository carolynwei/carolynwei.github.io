name: build Gmeek

on:
  # 手动触发
  workflow_dispatch:

  # Issue 发生变化时重新生成博客
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - closed
      - reopened

  # 每天 UTC 16:00 自动完整重建
  # 北京 / 台北时间 00:00
  schedule:
    - cron: "0 16 * * *"


jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04

    # 允许：
    # 1. 定时任务
    # 2. 手动运行
    # 3. 仓库 owner 对 issue 的操作
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id }}

    permissions:
      contents: write
      pages: write
      id-token: write
      issues: read

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v7


      # ==================================================
      # 2. Setup GitHub Pages
      # ==================================================
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4


      # ==================================================
      # 3. 检查配置 + 安装 jq
      # ==================================================
      - name: Check config.json
        run: |
          echo "====== check config.json ======"
          cat config.json
          echo "====== config.json end ======"

          sudo apt-get update
          sudo apt-get install -y jq


      # ==================================================
      # 4. Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'


      # ==================================================
      # 5. Clone Gmeek
      # ==================================================
      - name: Clone Gmeek source code
        run: |
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)

          echo "====== Gmeek version ======"
          echo "$GMEEK_VERSION"
          echo "==========================="

          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek

          cd /opt/Gmeek

          lastTag=$(git describe --tags "$(git rev-list --tags --max-count=1)")

          echo "Latest tag: $lastTag"

          if [ "$GMEEK_VERSION" = "last" ]; then
            git checkout "$lastTag"
          else
            git checkout "$GMEEK_VERSION"
          fi


      # ==================================================
      # 6. 安装 Gmeek 依赖
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt


      # ==================================================
      # 7. 生成博客
      # ==================================================
      - name: Generate blog
        run: |
          echo "====== Copy blog config to Gmeek ======"

          # 将当前博客仓库内容复制到 Gmeek
          cp -r ./* /opt/Gmeek/

          cd /opt/Gmeek

          echo "====== Build information ======"
          echo "event_name = ${{ github.event_name }}"
          echo "repository = ${{ github.repository }}"
          echo "================================="

          # ------------------------------------------------
          # IMPORTANT:
          #
          # 必须显式传入：
          #
          # --issue_number 0
          #
          # 否则部分 Gmeek 版本会把默认整数 0
          # 错误识别成单篇文章模式，并尝试访问 Issue #0，
          # 最终出现 GitHub API 404。
          #
          # 这里始终执行 runAll()，完整重建博客。
          # ------------------------------------------------

          python Gmeek.py \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            --issue_number 0


      # ==================================================
      # 8. 给每篇文章添加预计阅读时间
      # ==================================================
      - name: Add reading time
        run: |
          echo "====== Add reading time ======"

          echo "Reading time script:"
          ls -l "${{ github.workspace }}/tool/add_reading_time.py"

          python "${{ github.workspace }}/tool/add_reading_time.py" /opt/Gmeek

          echo "====== Reading time added ======"


      # ==================================================
      # 9. 将生成文件复制回博客仓库
      # ==================================================
      - name: Copy generated files back
        run: |
          echo "====== Copy generated files back ======"

          rm -rf "${{ github.workspace }}/docs"
          rm -rf "${{ github.workspace }}/backup"

          cp -a /opt/Gmeek/docs "${{ github.workspace }}"
          cp -a /opt/Gmeek/backup "${{ github.workspace }}"
          cp /opt/Gmeek/blogBase.json "${{ github.workspace }}"

          echo "====== Copy finished ======"


      # ==================================================
      # 10. Commit
      # ==================================================
      - name: Commit generated files
        run: |
          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "🎉 auto update by Gmeek action"
            git push
          fi


      # ==================================================
      # 11. 上传 GitHub Pages artifact
      # ==================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'


  # ====================================================
  # Deploy GitHub Pages
  # ====================================================
  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04

    needs: build

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
