name: build Gmeek

on:
  # 手动触发：Actions -> build Gmeek -> Run workflow
  workflow_dispatch:

  # Issue 有变化时自动重新构建
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - closed
      - reopened

  # 每天 UTC 16:00 自动完整重建
  # 对应北京时间 / 台北时间 00:00
  schedule:
    - cron: "0 16 * * *"

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04

    # Issue 事件只允许仓库 owner 的操作触发构建；
    # schedule 没有 sender，所以单独允许 schedule。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id }}

    permissions:
      contents: write
      pages: write
      id-token: write
      issues: read

    steps:
      # --------------------------------------------------
      # 1. Checkout 博客仓库
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # --------------------------------------------------
      # 2. 配置 GitHub Pages
      # --------------------------------------------------
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      # --------------------------------------------------
      # 3. 检查 config.json，并安装 jq
      # --------------------------------------------------
      - name: Check config.json
        run: |
          echo "====== check config.json ======"
          cat config.json
          echo "====== config.json end ======"

          sudo apt-get update
          sudo apt-get install -y jq

      # --------------------------------------------------
      # 4. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # --------------------------------------------------
      # 5. 下载指定版本 Gmeek
      # --------------------------------------------------
      - name: Clone Gmeek source code
        run: |
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)

          echo "====== Gmeek version ======"
          echo "$GMEEK_VERSION"
          echo "==========================="

          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek

          cd /opt/Gmeek

          lastTag=$(git describe --tags "$(git rev-list --tags --max-count=1)")

          echo "Latest tag: $lastTag"

          if [ "$GMEEK_VERSION" = "last" ]; then
            git checkout "$lastTag"
          else
            git checkout "$GMEEK_VERSION"
          fi

      # --------------------------------------------------
      # 6. 安装 Gmeek 依赖
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt

      # --------------------------------------------------
      # 7. 完整生成博客
      # --------------------------------------------------
      - name: Generate blog
        run: |
          echo "====== Copy blog config to Gmeek ======"

          cp -r ./* /opt/Gmeek/

          cd /opt/Gmeek

          echo "====== Build information ======"
          echo "event_name = ${{ github.event_name }}"
          echo "repository = ${{ github.repository }}"
          echo "================================="

          # ------------------------------------------------
          # IMPORTANT:
          #
          # 必须显式传：
          #
          #   --issue_number 0
          #
          # Gmeek.py 当前默认值是整数 0，
          # 但内部与字符串 "0" 比较。
          #
          # 如果完全省略这个参数：
          #
          #   0 != "0"
          #
          # Gmeek 会错误执行 runOne(0)，
          # 最后访问 GitHub Issue #0，
          # 导致：
          #
          #   GithubException: 404 Not Found
          #
          # 显式传字符串 "0" 后才会正确进入 runAll()。
          # ------------------------------------------------

          python Gmeek.py \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            --issue_number 0

          echo "====== Copy generated files back ======"

          rm -rf "${{ github.workspace }}/docs"
          rm -rf "${{ github.workspace }}/backup"

          cp -a /opt/Gmeek/docs "${{ github.workspace }}"
          cp -a /opt/Gmeek/backup "${{ github.workspace }}"
          cp /opt/Gmeek/blogBase.json "${{ github.workspace }}"

      # --------------------------------------------------
      # 8. 将 Gmeek 生成结果提交回仓库
      # --------------------------------------------------
      - name: Commit generated files
        run: |
          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "🎉 auto update by Gmeek action"
            git push
          fi

      # --------------------------------------------------
      # 9. 上传 GitHub Pages artifact
      # --------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'

  # ======================================================
  # Deploy
  # ======================================================

  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04

    needs: build

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
