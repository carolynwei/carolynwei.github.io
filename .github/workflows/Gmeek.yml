name: build Gmeek

on:
  workflow_dispatch:

  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - closed
      - reopened

  schedule:
    - cron: "0 16 * * *"

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04

    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' }}

    permissions:
      contents: write
      pages: write
      id-token: write
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Check config.json
        run: |
          echo "====== check config.json ======"
          cat config.json
          echo "====== config.json end ======"

          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Clone Gmeek source code
        run: |
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)

          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek

          cd /opt/Gmeek

          lastTag=$(git describe --tags "$(git rev-list --tags --max-count=1)")

          if [ "$GMEEK_VERSION" = "last" ]; then
            git checkout "$lastTag"
          else
            git checkout "$GMEEK_VERSION"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt

      - name: Generate blog
        run: |
          echo "====== Copy blog config to Gmeek ======"

          cp -r ./* /opt/Gmeek/

          cd /opt/Gmeek

          echo "====== Build information ======"
          echo "event_name = ${{ github.event_name }}"
          echo "repository = ${{ github.repository }}"
          echo "================================="

          # Always rebuild the whole blog.
          # Gmeek runAll() cleans old generated files first,
          # then regenerates posts from currently available issues.
          python Gmeek.py \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}"

          echo "====== Copy generated files back ======"

          rm -rf "${{ github.workspace }}/docs"
          rm -rf "${{ github.workspace }}/backup"

          cp -a /opt/Gmeek/docs "${{ github.workspace }}"
          cp -a /opt/Gmeek/backup "${{ github.workspace }}"
          cp /opt/Gmeek/blogBase.json "${{ github.workspace }}"

      - name: Commit generated files
        run: |
          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "🎉 auto update by Gmeek action"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'

  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04

    needs: build

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
